name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK and Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sefr_Ta_Farhangian_v3.6_Debug
          path: app/build/outputs/apk/debug/Sefr_Ta_Farhangian_v3.6-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Publish a normal GitHub Release only from main or a manual run.
      # Other branches still get build artifacts, but do not publish releases.
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v3.6-b${{ github.run_number }}
          name: "نسخه ۳.۶ صفر تا فرهنگیان (بیلد ${{ github.run_number }})"
          body: |
            فایل نصب اندروید اپلیکیشن صفر تا فرهنگیان و کنکور انسانی ۱۴۰۶.

            - خروجی APK پایدار نسخه ۳.۶
            - ساخته‌شده پس از اجرای موفق ۱۰۰٪ تست‌های واحد
            - اصلاح کامل عناوین، تب‌های اسکرول‌پذیر منابع، تقویم و رادار ارتقای تراز
          files: app/build/outputs/apk/debug/Sefr_Ta_Farhangian_v3.6-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
