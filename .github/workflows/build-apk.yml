name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK and Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare keystore
        run: |
          if [ -f my-upload-key.jks.base64 ]; then
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Run Unit Tests & Build Official Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true"
          cp app/build/outputs/apk/release/Sefr_Ta_Farhangian_v4.0-release.apk app/build/outputs/apk/release/Sefr_Ta_Farhangian_v4.0.apk

      - name: Upload Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sefr_Ta_Farhangian_v4.0
          path: app/build/outputs/apk/release/Sefr_Ta_Farhangian_v4.0.apk
          if-no-files-found: error
          retention-days: 90

      # Publish official GitHub Release only for builds of main
      - name: Publish Official APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.0-b${{ github.run_number }}
          name: "نسخه رسمی ۳.۶ صفر تا فرهنگیان (بیلد ${{ github.run_number }})"
          body: |
            فایل نصب رسمی و نهایی اپلیکیشن صفر تا فرهنگیان و کنکور انسانی ۱۴۰۶.

            - خروجی APK نسخه رسمی (Release)
            - نام فایل: Sefr_Ta_Farhangian_v4.0.apk
            - ساخته‌شده پس از اجرای موفق ۱۰۰٪ تست‌های واحد
            - طراحی Material 3 Expressive و آیکون اختصاصی جدید
          files: app/build/outputs/apk/release/Sefr_Ta_Farhangian_v4.0.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
